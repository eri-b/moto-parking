<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Parking | New York City</title>
  <link rel="stylesheet" href="style.css" />
    <!-- Favicon: modern, cross-browser -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any">

  <link rel="mask-icon" href="/favicon.svg" color="#000">


  <!-- Privacy-friendly analytics by Plausible -->
  <script async src="https://plausible.io/js/pa-5o8K7wWtyBLmNMhvxDO6H.js"></script>
  <script>
    window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
    plausible.init()
  </script>

</head>
<body>
  <header class="app-header">
    <div class="heading-row">
      <h1 class="title">New York City &mdash; <em>Free</em> Parking</h1>
      <a class="about-link" href="https://unfoundedlabs.com/blog/nyc-moto-parking" target="_blank" rel="noopener">Why / How</a>
    </div>
    <div class="map-meta">
      <span class="map-legend"><span class="legend-dot" aria-hidden="true"></span>Parking signs</span>
      <span id="data-freshness"></span>
    </div>
  </header>
  <main class="map-shell" aria-label="Parking sign map">
    <div id="map"></div>
    <div class="status-panel">
      <p id="map-status" role="status" aria-live="polite">Loading map…</p>
      <button id="retry-load" type="button" hidden>Retry</button>
    </div>
  </main>
  <noscript><p class="noscript-message">Enable JavaScript to use the parking map.</p></noscript>

  <script src="map-data.js"></script>
  <script src="map.js"></script>
  <script
    async
    defer
    onerror="mapLoadFailed()"
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCBeRRun71hiYB58yS-A-9W8bI6wSn_kxM&loading=async&callback=initMap">
  </script>
</body>
</html>
